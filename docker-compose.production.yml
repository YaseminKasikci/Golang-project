x-logging: &highlight-logging
  driver: fluentd
  options:
    fluentd-address: "tls://otel.highlight.io:24284"
    fluentd-async: "true"
    fluentd-sub-second-precision: "true"
    tag: "highlight.project_id=4g889zjg"

services:
  server:
    build:
      context: ./
      dockerfile: Dockerfile
    restart: always
    volumes:
      - ~/data/lenslocked.com/images./images:/app/images
    depends_on:
      - db
    logging: *highlight-logging

  caddy:
    image: caddy
    restart: always
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ~/data/lenslocked.com/caddy:/data
    logging: *highlight-logging

  db:
    environment:
      PGDARA: /var/lib/postgresql/data/pgdata
      POSTGRES_USER: ${PSQL_USER}
      POSTGRES_PASSWORD: ${PSQL_PASSWORD}
      POSTGRES_DB: ${PSQL_DATABASE}
    volumes:
      - ~/data/lenslocked.com/psql:/var/lib/postgresql/data/pgdata
    logging: *highlight-logging
